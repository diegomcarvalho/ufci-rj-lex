title: Formato de Resoluções, Regulamentos, Normas e Padrões
author: Diego Carvalho
version: 0.1.0
quarto-required: ">= 1.7.24"
contributes:
  formats:
    common:
      lang: pt-BR
      biblio-config: false
      filters:
        - shortcodes.lua
        - br-lex.lua
      shortcodes:
        - shortcodes.lua
      knitr:
        opts_chunk:
          echo: false
    html:
      toc: true
      toc-depth: 3
      theme: [yeti, custom.scss]
      include-before-body:
        - file: header.html
      format-resources:
        - brasao-versao-oficial.jpg
    pdf:
      documentclass: cefet-lex
      classoption: [paragrafoespaco]
      pdf-engine: lualatex
      papersize: a4
      fontsize: 9pt
      mainfont: Latin Modern Roman
      number-sections: true
      pdf-standard: a-2b
      template-partials:
        - "partials/babel-lang.tex"
        - "partials/title.tex"
        - "partials/before-body.tex"
      format-resources:
        - cefet-lex.cls
      filters:
        - shortcodes.lua
        - br-lex.lua
